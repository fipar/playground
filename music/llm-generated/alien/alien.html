<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Tape Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        
        h1 {
            text-align: center;
            color: #00ff00;
            margin-bottom: 30px;
        }
        
        .transport-controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .transport-controls button {
            font-size: 16px;
            padding: 12px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #444;
            color: #fff;
            transition: background 0.3s;
        }
        
        .transport-controls button:hover {
            background: #666;
        }
        
        .transport-controls button.active {
            background: #00ff00;
            color: #000;
        }
        
        .sound-source {
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #333;
        }
        
        .sound-source h3 {
            color: #00ff00;
            margin-top: 0;
        }
        
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .control {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }
        
        .control label {
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        input[type="range"] {
            width: 100px;
            height: 4px;
            background: #555;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00ff00;
            border-radius: 50%;
            cursor: pointer;
        }
        
        input[type="file"] {
            font-size: 12px;
            padding: 5px;
            background: #444;
            border: 1px solid #666;
            border-radius: 3px;
            color: #fff;
        }
        
        select {
            padding: 5px;
            background: #444;
            border: 1px solid #666;
            border-radius: 3px;
            color: #fff;
        }
        
        input[type="text"], input[type="number"] {
            padding: 5px;
            background: #444;
            border: 1px solid #666;
            border-radius: 3px;
            color: #fff;
            width: 80px;
        }
        
        .value-display {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALIEN TAPE PLAYER</h1>
        
        <div class="transport-controls">
            <button id="playBtn">PLAY</button>
            <button id="stopBtn">STOP</button>
            <button id="recordBtn">RECORD</button>
        </div>
        
        <!-- Oscillator 1 -->
        <div class="sound-source">
            <h3>Oscillator 1</h3>
            <div class="control-group">
                <div class="control">
                    <label>Volume</label>
                    <input type="range" id="osc1Volume" min="0" max="1" step="0.01" value="0.3">
                    <div class="value-display" id="osc1VolumeValue">0</div>
                </div>
                <div class="control">
                    <label>Shape (Sine→Square)</label>
                    <input type="range" id="osc1Shape" min="0" max="1" step="0.01" value="0">
                    <div class="value-display" id="osc1ShapeValue">Sine</div>
                </div>
                <div class="control">
                    <label>Frequency (Hz)</label>
                    <input type="range" id="osc1Freq" min="20" max="20000" step="1" value="440">
                    <div class="value-display" id="osc1FreqValue">440</div>
                </div>
                <div class="control">
                    <label>MIDI File</label>
                    <input type="file" id="osc1Midi" accept=".mid,.midi">
                </div>
            </div>
        </div>
        
        <!-- Oscillator 2 -->
        <div class="sound-source">
            <h3>Oscillator 2</h3>
            <div class="control-group">
                <div class="control">
                    <label>Volume</label>
                    <input type="range" id="osc2Volume" min="0" max="1" step="0.01" value="0">
                    <div class="value-display" id="osc2VolumeValue">0</div>
                </div>
                <div class="control">
                    <label>Shape (Sine→Square)</label>
                    <input type="range" id="osc2Shape" min="0" max="1" step="0.01" value="0">
                    <div class="value-display" id="osc2ShapeValue">Sine</div>
                </div>
                <div class="control">
                    <label>Frequency (Hz)</label>
                    <input type="range" id="osc2Freq" min="20" max="20000" step="1" value="440">
                    <div class="value-display" id="osc2FreqValue">440</div>
                </div>
                <div class="control">
                    <label>MIDI File</label>
                    <input type="file" id="osc2Midi" accept=".mid,.midi">
                </div>
            </div>
        </div>
        
        <!-- Oscillator 3 -->
        <div class="sound-source">
            <h3>Oscillator 3</h3>
            <div class="control-group">
                <div class="control">
                    <label>Volume</label>
                    <input type="range" id="osc3Volume" min="0" max="1" step="0.01" value="0">
                    <div class="value-display" id="osc3VolumeValue">0</div>
                </div>
                <div class="control">
                    <label>Shape (Sine→Square)</label>
                    <input type="range" id="osc3Shape" min="0" max="1" step="0.01" value="0">
                    <div class="value-display" id="osc3ShapeValue">Sine</div>
                </div>
                <div class="control">
                    <label>Frequency (Hz)</label>
                    <input type="range" id="osc3Freq" min="20" max="20000" step="1" value="440">
                    <div class="value-display" id="osc3FreqValue">440</div>
                </div>
                <div class="control">
                    <label>MIDI File</label>
                    <input type="file" id="osc3Midi" accept=".mid,.midi">
                </div>
            </div>
        </div>
        
        <!-- Noise Source -->
        <div class="sound-source">
            <h3>Noise Source</h3>
            <div class="control-group">
                <div class="control">
                    <label>Volume</label>
                    <input type="range" id="noiseVolume" min="0" max="1" step="0.01" value="0.2">
                    <div class="value-display" id="noiseVolumeValue">0</div>
                </div>
                <div class="control">
                    <label>Noise Type</label>
                    <select id="noiseType">
                        <option value="pink">Pink</option>
                        <option value="white">White</option>
                        <option value="normal">Normal Distribution</option>
                        <option value="exponential">Exponential Distribution</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Audio File Source -->
        <div class="sound-source">
            <h3>Audio File Source</h3>
            <div class="control-group">
                <div class="control">
                    <label>Volume</label>
                    <input type="range" id="audioVolume" min="0" max="1" step="0.01" value="0">
                    <div class="value-display" id="audioVolumeValue">0</div>
                </div>
                <div class="control">
                    <label>Audio File</label>
                    <input type="file" id="audioFile" accept="audio/*">
                </div>
                <div class="control">
                    <label>Playback Speed (%)</label>
                    <input type="number" id="audioSpeed" min="10" max="500" value="100">
                </div>
                <div class="control">
                    <label>Direction</label>
                    <select id="audioDirection">
                        <option value="forward">Forward</option>
                        <option value="reverse">Reverse</option>
                    </select>
                </div>
                <div class="control">
                    <label>Skip Playback</label>
                    <input type="checkbox" id="audioSkip">
                </div>
            </div>
        </div>
    </div>

    <script>
        class AlienTapePlayer {
            constructor() {
                this.audioContext = null;
                this.masterGain = null;
                this.isPlaying = false;
                this.isRecording = false;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                
                this.oscillators = [null, null, null];
                this.oscillatorGains = [null, null, null];
                this.midiData = [null, null, null];
                this.midiPosition = [0, 0, 0];
                
                this.noiseNode = null;
                this.noiseGain = null;
                this.noiseBuffer = null;
                this.noiseSource = null;
                
                this.audioBuffer = null;
                this.audioSource = null;
                this.audioGain = null;
                
                this.init();
            }
            
            async init() {
                this.setupEventListeners();
                this.updateValueDisplays();
            }
            
            async initAudioContext() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.audioContext.createGain();
                    this.masterGain.connect(this.audioContext.destination);
                    
                    // Create oscillator gains
                    for (let i = 0; i < 3; i++) {
                        this.oscillatorGains[i] = this.audioContext.createGain();
                        this.oscillatorGains[i].gain.value = 0;
                        this.oscillatorGains[i].connect(this.masterGain);
                    }
                    
                    // Create noise gain
                    this.noiseGain = this.audioContext.createGain();
                    this.noiseGain.gain.value = 0;
                    this.noiseGain.connect(this.masterGain);
                    
                    // Create audio file gain
                    this.audioGain = this.audioContext.createGain();
                    this.audioGain.gain.value = 0;
                    this.audioGain.connect(this.masterGain);
                }
                
                // Resume audio context if suspended (Safari requirement)
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
            }
            
            setupEventListeners() {
                // Transport controls
                document.getElementById('playBtn').addEventListener('click', () => this.play());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                document.getElementById('recordBtn').addEventListener('click', () => this.toggleRecord());
                
                // Oscillator controls
                for (let i = 1; i <= 3; i++) {
                    document.getElementById(`osc${i}Volume`).addEventListener('input', async (e) => await this.updateOscillatorVolume(i-1, e.target.value));
                    document.getElementById(`osc${i}Shape`).addEventListener('input', (e) => this.updateOscillatorShape(i-1, e.target.value));
                    document.getElementById(`osc${i}Freq`).addEventListener('input', (e) => this.updateOscillatorFreq(i-1, e.target.value));
                    document.getElementById(`osc${i}Midi`).addEventListener('change', (e) => this.loadMidiFile(i-1, e.target.files[0]));
                }
                
                // Noise controls
                document.getElementById('noiseVolume').addEventListener('input', async (e) => await this.updateNoiseVolume(e.target.value));
                document.getElementById('noiseType').addEventListener('change', (e) => this.updateNoiseType(e.target.value));
                
                // Audio file controls
                document.getElementById('audioVolume').addEventListener('input', async (e) => await this.updateAudioVolume(e.target.value));
                document.getElementById('audioFile').addEventListener('change', (e) => this.loadAudioFile(e.target.files[0]));
                document.getElementById('audioSpeed').addEventListener('input', (e) => this.updateAudioSpeed(e.target.value));
                document.getElementById('audioDirection').addEventListener('change', (e) => this.updateAudioDirection(e.target.value));
                document.getElementById('audioSkip').addEventListener('change', (e) => this.updateAudioSkip(e.target.checked));
                
                // Update value displays
                this.setupValueDisplays();
            }
            
            setupValueDisplays() {
                for (let i = 1; i <= 3; i++) {
                    document.getElementById(`osc${i}Volume`).addEventListener('input', () => this.updateValueDisplays());
                    document.getElementById(`osc${i}Shape`).addEventListener('input', () => this.updateValueDisplays());
                    document.getElementById(`osc${i}Freq`).addEventListener('input', () => this.updateValueDisplays());
                }
                document.getElementById('noiseVolume').addEventListener('input', () => this.updateValueDisplays());
                document.getElementById('audioVolume').addEventListener('input', () => this.updateValueDisplays());
            }
            
            updateValueDisplays() {
                for (let i = 1; i <= 3; i++) {
                    const volume = document.getElementById(`osc${i}Volume`).value;
                    const shape = document.getElementById(`osc${i}Shape`).value;
                    const freq = document.getElementById(`osc${i}Freq`).value;
                    
                    document.getElementById(`osc${i}VolumeValue`).textContent = (volume * 100).toFixed(0) + '%';
                    document.getElementById(`osc${i}ShapeValue`).textContent = shape == 0 ? 'Sine' : shape == 1 ? 'Square' : 'Mixed';
                    document.getElementById(`osc${i}FreqValue`).textContent = freq + ' Hz';
                }
                
                const noiseVol = document.getElementById('noiseVolume').value;
                document.getElementById('noiseVolumeValue').textContent = (noiseVol * 100).toFixed(0) + '%';
                
                const audioVol = document.getElementById('audioVolume').value;
                document.getElementById('audioVolumeValue').textContent = (audioVol * 100).toFixed(0) + '%';
            }
            
            async play() {
                if (this.isPlaying) return;
                
                await this.initAudioContext();
                
                this.isPlaying = true;
                document.getElementById('playBtn').classList.add('active');
                
                this.startOscillators();
                this.startNoise();
                this.startAudioFile();
            }
            
            stop() {
                if (!this.isPlaying) return;
                
                this.isPlaying = false;
                document.getElementById('playBtn').classList.remove('active');
                
                this.stopOscillators();
                this.stopNoise();
                this.stopAudioFile();
                
                if (this.isRecording) {
                    this.stopRecording();
                }
            }
            
            async toggleRecord() {
                if (this.isRecording) {
                    this.stopRecording();
                } else {
                    await this.startRecording();
                }
            }
            
            async startRecording() {
                if (!this.audioContext) {
                    await this.initAudioContext();
                }
                
                try {
                    const dest = this.audioContext.createMediaStreamDestination();
                    this.masterGain.connect(dest);
                    
                    this.mediaRecorder = new MediaRecorder(dest.stream);
                    this.recordedChunks = [];
                    
                    this.mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            this.recordedChunks.push(e.data);
                        }
                    };
                    
                    this.mediaRecorder.onstop = () => {
                        const blob = new Blob(this.recordedChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'alien_recording.webm';
                        a.click();
                        URL.revokeObjectURL(url);
                    };
                    
                    this.mediaRecorder.start();
                    this.isRecording = true;
                    document.getElementById('recordBtn').classList.add('active');
                    
                } catch (error) {
                    console.error('Recording failed:', error);
                }
            }
            
            stopRecording() {
                if (this.mediaRecorder && this.isRecording) {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    document.getElementById('recordBtn').classList.remove('active');
                }
            }
            
            startOscillators() {
                for (let i = 0; i < 3; i++) {
                    const volume = document.getElementById(`osc${i+1}Volume`).value;
                    if (volume > 0) {
                        this.createOscillator(i);
                    }
                }
            }
            
            createOscillator(index) {
                if (this.oscillators[index]) {
                    this.oscillators[index].stop();
                }
                
                this.oscillators[index] = this.audioContext.createOscillator();
                
                const freq = this.getCurrentFrequency(index);
                const shape = document.getElementById(`osc${index+1}Shape`).value;
                
                this.oscillators[index].frequency.value = freq;
                
                // Create custom waveform based on shape
                if (shape == 0) {
                    this.oscillators[index].type = 'sine';
                } else if (shape == 1) {
                    this.oscillators[index].type = 'square';
                } else {
                    // Create a mixed waveform
                    const real = new Float32Array([0, 1 - shape, 0, shape]);
                    const imag = new Float32Array(real.length);
                    const wave = this.audioContext.createPeriodicWave(real, imag);
                    this.oscillators[index].setPeriodicWave(wave);
                }
                
                this.oscillators[index].connect(this.oscillatorGains[index]);
                this.oscillators[index].start();
                
                // Handle MIDI playback
                if (this.midiData[index]) {
                    this.scheduleMidiNotes(index);
                }
            }
            
            getCurrentFrequency(index) {
                if (this.midiData[index] && this.midiData[index].length > 0) {
                    const note = this.midiData[index][this.midiPosition[index] % this.midiData[index].length];
                    return this.midiNoteToFreq(note);
                }
                return document.getElementById(`osc${index+1}Freq`).value;
            }
            
            midiNoteToFreq(note) {
                return 440 * Math.pow(2, (note - 69) / 12);
            }
            
            async loadMidiFile(index, file) {
                if (!file) return;
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const midiData = this.parseMidiFile(arrayBuffer);
                    this.midiData[index] = midiData;
                    this.midiPosition[index] = 0;
                } catch (error) {
                    console.error('Error loading MIDI file:', error);
                }
            }
            
            parseMidiFile(arrayBuffer) {
                // Simple MIDI parser - extracts note numbers
                const view = new DataView(arrayBuffer);
                const notes = [];
                
                // This is a very basic MIDI parser
                // In a real implementation, you'd use a proper MIDI parsing library
                for (let i = 0; i < view.byteLength - 2; i++) {
                    if (view.getUint8(i) === 0x90) { // Note on
                        const note = view.getUint8(i + 1);
                        if (note >= 21 && note <= 108) { // Piano range
                            notes.push(note);
                        }
                    }
                }
                
                return notes.length > 0 ? notes : [60, 64, 67]; // Default C major chord
            }
            
            scheduleMidiNotes(index) {
                if (!this.midiData[index] || !this.isPlaying) return;
                
                setTimeout(() => {
                    if (this.oscillators[index] && this.isPlaying) {
                        const freq = this.getCurrentFrequency(index);
                        this.oscillators[index].frequency.setValueAtTime(freq, this.audioContext.currentTime);
                        this.midiPosition[index]++;
                        this.scheduleMidiNotes(index);
                    }
                }, 500); // Change note every 500ms
            }
            
            stopOscillators() {
                for (let i = 0; i < 3; i++) {
                    if (this.oscillators[i]) {
                        this.oscillators[i].stop();
                        this.oscillators[i] = null;
                    }
                }
            }
            
            startNoise() {
                const volume = document.getElementById('noiseVolume').value;
                if (volume > 0) {
                    this.createNoise();
                }
            }
            
            createNoise() {
                const type = document.getElementById('noiseType').value;
                const bufferSize = this.audioContext.sampleRate * 2; // 2 seconds
                this.noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const output = this.noiseBuffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    switch (type) {
                        case 'white':
                            output[i] = Math.random() * 2 - 1;
                            break;
                        case 'pink':
                            output[i] = this.generatePinkNoise();
                            break;
                        case 'normal':
                            output[i] = this.boxMuller();
                            break;
                        case 'exponential':
                            output[i] = -Math.log(Math.random());
                            break;
                    }
                }
                
                this.noiseSource = this.audioContext.createBufferSource();
                this.noiseSource.buffer = this.noiseBuffer;
                this.noiseSource.loop = true;
                this.noiseSource.connect(this.noiseGain);
                this.noiseSource.start();
            }
            
            generatePinkNoise() {
                // Simple pink noise approximation
                let white = Math.random() * 2 - 1;
                return white * 0.1; // Simplified pink noise
            }
            
            boxMuller() {
                // Box-Muller transform for normal distribution
                const u = Math.random();
                const v = Math.random();
                return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * 0.1;
            }
            
            stopNoise() {
                if (this.noiseSource) {
                    this.noiseSource.stop();
                    this.noiseSource = null;
                }
            }
            
            async startAudioFile() {
                const volume = document.getElementById('audioVolume').value;
                if (volume > 0 && this.audioBuffer) {
                    this.createAudioSource();
                }
            }
            
            createAudioSource() {
                if (this.audioSource) {
                    this.audioSource.stop();
                }
                
                this.audioSource = this.audioContext.createBufferSource();
                this.audioSource.buffer = this.audioBuffer;
                this.audioSource.loop = true;
                
                const speed = document.getElementById('audioSpeed').value / 100;
                const direction = document.getElementById('audioDirection').value;
                
                this.audioSource.playbackRate.value = direction === 'reverse' ? -speed : speed;
                
                if (document.getElementById('audioSkip').checked) {
                    this.scheduleAudioSkips();
                }
                
                this.audioSource.connect(this.audioGain);
                this.audioSource.start();
            }
            
            scheduleAudioSkips() {
                if (!this.isPlaying) return;
                
                setTimeout(() => {
                    if (this.audioSource && this.isPlaying) {
                        // Randomly skip by stopping and restarting
                        if (Math.random() < 0.3) { // 30% chance to skip
                            this.audioSource.stop();
                            setTimeout(() => {
                                if (this.isPlaying) this.createAudioSource();
                            }, Math.random() * 200 + 100);
                        }
                        this.scheduleAudioSkips();
                    }
                }, Math.random() * 2000 + 1000); // Skip check every 1-3 seconds
            }
            
            async loadAudioFile(file) {
                if (!file) return;
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    await this.initAudioContext();
                    this.audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                } catch (error) {
                    console.error('Error loading audio file:', error);
                }
            }
            
            stopAudioFile() {
                if (this.audioSource) {
                    this.audioSource.stop();
                    this.audioSource = null;
                }
            }
            
            async updateOscillatorVolume(index, value) {
                await this.initAudioContext();
                if (this.oscillatorGains[index]) {
                    this.oscillatorGains[index].gain.value = value;
                }
            }
            
            updateOscillatorShape(index, value) {
                if (this.oscillators[index] && this.isPlaying) {
                    // Recreate oscillator with new shape
                    this.oscillators[index].stop();
                    setTimeout(() => this.createOscillator(index), 10);
                }
            }
            
            updateOscillatorFreq(index, value) {
                if (this.oscillators[index] && !this.midiData[index]) {
                    this.oscillators[index].frequency.value = value;
                }
            }
            
            async updateNoiseVolume(value) {
                await this.initAudioContext();
                if (this.noiseGain) {
                    this.noiseGain.gain.value = value;
                }
            }
            
            updateNoiseType(type) {
                if (this.noiseSource && this.isPlaying) {
                    this.stopNoise();
                    setTimeout(() => this.startNoise(), 10);
                }
            }
            
            async updateAudioVolume(value) {
                await this.initAudioContext();
                if (this.audioGain) {
                    this.audioGain.gain.value = value;
                }
            }
            
            updateAudioSpeed(value) {
                if (this.audioSource) {
                    const direction = document.getElementById('audioDirection').value;
                    this.audioSource.playbackRate.value = direction === 'reverse' ? -(value / 100) : (value / 100);
                }
            }
            
            updateAudioDirection(direction) {
                if (this.audioSource) {
                    const speed = document.getElementById('audioSpeed').value / 100;
                    this.audioSource.playbackRate.value = direction === 'reverse' ? -speed : speed;
                }
            }
            
            updateAudioSkip(enabled) {
                // Skip functionality is handled in createAudioSource
            }
        }
        
        // Initialize the app
        const alienPlayer = new AlienTapePlayer();
    </script>
</body>
</html>
